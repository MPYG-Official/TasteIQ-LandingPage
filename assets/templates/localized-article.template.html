<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | TasteIQ</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="https://tasteiq.in/{{canonicalPath}}">
  <!-- Add hreflang link tags for en + generated locales -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{cssPath}}">
</head>
<body>
  <div id="site-nav" data-root="{{root}}" data-active="articles"></div>

  <header class="article-hero">
    <div class="container">
      <span class="section-eyebrow">{{eyebrow}}</span>
      <h1>{{h1}}</h1>
      <p class="lead">{{intro}}</p>
    </div>
  </header>

  <main class="container article-body pb-5">
    <!-- {{sectionsHtml}} -->
    <div class="wa-cta mt-4">
      <a class="btn-whatsapp" href="https://wa.me/916207466460?text={{waTextEncoded}}" target="_blank" rel="noopener noreferrer">{{waLabel}}</a>
    </div>
  </main>

  <footer id="site-footer" data-root="{{root}}" data-active="articles"></footer>
  <script src="{{chromePath}}"></script>
  <script src="{{localeJsPath}}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
